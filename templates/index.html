
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;
 background:radial-gradient(ellipse at center,#07345a,#020817 65%,#01040b);
 color:#8eeeff;font-family:Arial,sans-serif;
 text-align:center;overflow-x:hidden;
}

header{
 padding:22px 10px 5px;font-size:29px;
 letter-spacing:8px;color:#d7faff;
 text-shadow:0 0 20px #00dfff;
}

.subtitle{font-size:10px;letter-spacing:4px;color:#36caff}

.topline{
 width:90%;max-width:440px;margin:20px auto;
 display:flex;justify-content:space-between;
 font-size:10px;letter-spacing:2px;color:#6bdfff;
}

.dot{
 display:inline-block;width:7px;height:7px;
 background:#00ffae;border-radius:50%;
 box-shadow:0 0 10px #00ffae;margin-right:6px;
}

.hud{
 width:290px;height:290px;margin:20px auto;
 position:relative;display:flex;
 align-items:center;justify-content:center;
}

.ring{position:absolute;border-radius:50%}

.r1{
 width:280px;height:280px;
 border:2px solid transparent;
 border-top-color:#00eaff;border-bottom-color:#00eaff;
 box-shadow:0 0 18px #007bff;
 animation:spin 8s linear infinite;
}

.r2{
 width:245px;height:245px;
 border:2px dashed #159fff;
 animation:reverse 13s linear infinite;
}

.r3{
 width:205px;height:205px;
 border:3px solid transparent;
 border-left-color:#00eaff;border-right-color:#00eaff;
 box-shadow:0 0 20px #008cff;
 animation:spin 4s linear infinite;
}

.r4{
 width:165px;height:165px;
 border:1px solid #58dfff;
 box-shadow:inset 0 0 22px #007bff;
}

.core{
 width:112px;height:112px;border-radius:50%;
 background:radial-gradient(circle,#fff,#8ffaff 12%,#00aaff 40%,#0045a8 72%,#00132d);
 box-shadow:0 0 25px #00dfff,0 0 65px #007bff;
 animation:pulse 2s infinite;
}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reverse{to{transform:rotate(-360deg)}}

@keyframes pulse{
 50%{transform:scale(1.1);box-shadow:0 0 85px #00dfff}
}

body.active .core{animation:pulse .55s infinite}
body.active .r1{animation-duration:2s}

.status{
 margin:15px;font-size:12px;
 letter-spacing:3px;color:#8eeeff;
}

.panel{
 width:92%;max-width:460px;margin:auto;padding:16px;
 border:1px solid #087cb5;border-radius:16px;
 background:rgba(2,18,37,.9);
 box-shadow:0 0 25px #003c69;
}

#reply{
 min-height:70px;max-height:190px;overflow-y:auto;
 padding:12px;color:white;font-size:14px;
 line-height:1.7;white-space:pre-wrap;text-align:left;
}

input,select{
 width:100%;padding:14px;margin:7px 0;
 border:1px solid #00bfff;border-radius:10px;
 background:#031326;color:white;outline:none;font-size:15px;
}

select option{background:#031326}

.controls{
 display:flex;justify-content:center;
 flex-wrap:wrap;gap:7px;
}

button{
 padding:12px 17px;border:1px solid #00bfff;
 border-radius:30px;background:linear-gradient(135deg,#06365c,#00172d);
 color:#8eeeff;font-size:13px;box-shadow:0 0 12px #004b83;
}

button:active{background:#00699c}

button:disabled{opacity:.5}

.footer{
 margin:25px 0;color:#3986ad;
 font-size:10px;letter-spacing:3px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S</header>
<div class="subtitle">PERSONAL AI SYSTEM</div>

<div class="topline">
 <span><i class="dot"></i>CORE READY</span>
 <span id="clock">--:--</span>
</div>

<div class="hud">
 <div class="ring r1"></div>
 <div class="ring r2"></div>
 <div class="ring r3"></div>
 <div class="ring r4"></div>
 <div class="core"></div>
</div>

<div class="status" id="status">● JARVIS SYSTEM ONLINE</div>

<div class="panel">

 <div id="reply">
 Hello! I am JARVIS. How may I assist you?
 </div>

 <input id="message"
 placeholder="Talk to JARVIS..."
 autocomplete="off">

 <select id="language">
  <option value="mr-IN">Marathi</option>
  <option value="hi-IN">Hindi</option>
  <option value="en-IN">English (India)</option>
 </select>

 <div class="controls">
  <button id="sendBtn" onclick="ask()">SEND</button>
  <button onclick="listen()">🎙 SPEAK</button>
  <button onclick="stopVoice()">STOP VOICE</button>
 </div>

</div>

<div class="footer">STARK TECHNOLOGY • PERSONAL AI</div>

<script>
const status=document.getElementById("status");
const message=document.getElementById("message");
const reply=document.getElementById("reply");
const language=document.getElementById("language");
const sendBtn=document.getElementById("sendBtn");

let availableVoices=[];
let recognition=null;
let isSpeaking=false;

function loadVoices(){
 if(!("speechSynthesis" in window))return;
 availableVoices=speechSynthesis.getVoices();
}

if("speechSynthesis" in window){
 loadVoices();
 speechSynthesis.onvoiceschanged=loadVoices;
}

// Clock
function updateClock(){
 document.getElementById("clock").innerText=
 new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// Language detection
function detectLanguage(text){
 const lower=text.toLowerCase();

 if(!/[ऀ-ॿ]/.test(text))return "en";

 const marathiWords=[
 "आहे","आहेत","माझं","माझी","मला","तुला",
 "काय","नाही","होय","करू","करतो","करते",
 "तुम्ही","आपण","असे","असं","म्हणजे",
 "छान","पाहिजे","सांगतो","सांगते","करायला"
 ];

 const hindiWords=[
 "है","हैं","मेरा","मेरी","मुझे","तुम्हें",
 "क्या","नहीं","हाँ","आप","कैसे","क्यों",
 "लेकिन","चाहिए","बताओ","करना","होता","होती"
 ];

 let ms=0,hs=0;

 marathiWords.forEach(w=>{if(text.includes(w))ms++});
 hindiWords.forEach(w=>{if(text.includes(w))hs++});

 return hs>ms?"hi":"mr";
}

// Voice selection
function getVoice(lang){
 loadVoices();

 const prefix={
  mr:"mr-IN",
  hi:"hi-IN",
  en:"en-IN"
 }[lang];

 let voice=availableVoices.find(v=>
  v.lang.toLowerCase()===prefix.toLowerCase()
 );

 if(!voice && lang==="en"){
  voice=availableVoices.find(v=>
   v.lang.toLowerCase().startsWith("en-in")
  );
 }

 if(!voice && lang==="en"){
  voice=availableVoices.find(v=>
   v.lang.toLowerCase().startsWith("en")
  );
 }

 return voice||null;
}

// JARVIS Voice
function speak(text){
 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const detected=detectLanguage(text);
 const speech=new SpeechSynthesisUtterance(text);
 const voice=getVoice(detected);

 if(voice){
  speech.voice=voice;
  speech.lang=voice.lang;
 }else{
  speech.lang={
   mr:"mr-IN",
   hi:"hi-IN",
   en:"en-IN"
  }[detected];
 }

 // Deep cinematic tuning
 speech.rate=0.88;
 speech.pitch=0.75;
 speech.volume=1;

 speech.onstart=()=>{
  isSpeaking=true;
  document.body.classList.add("active");
  status.innerText="● JARVIS SPEAKING";
 };

 speech.onend=()=>{
  isSpeaking=false;
  document.body.classList.remove("active");
  status.innerText="● JARVIS ONLINE";
 };

 speech.onerror=()=>{
  isSpeaking=false;
  document.body.classList.remove("active");
  status.innerText="● VOICE ENGINE ERROR";
 };
 
 speechSynthesis.speak(speech);
}

// Send message
async function ask(){
 const text=message.value.trim();
 if(!text)return;

 stopVoice();

 status.innerText="● PROCESSING REQUEST";
 document.body.classList.add("active");
 sendBtn.disabled=true;

 try{
  const res=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message:text})
  });

  if(!res.ok)throw new Error("Connection failed");

  const data=await res.json();

  reply.innerText=data.reply;

  document.body.classList.remove("active");
  status.innerText="● JARVIS ONLINE";

  speak(data.reply);

 }catch(error){
  document.body.classList.remove("active");
  status.innerText="● CONNECTION ERROR";
  reply.innerText="JARVIS connection unavailable. Please try again.";
 }finally{
  sendBtn.disabled=false;
 }
}

// Voice input
function listen(){
 const SpeechRecognition=
  window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Please use Chrome for voice recognition.");
  return;
 }

 if(recognition){
  try{recognition.abort()}catch(e){}
 }

 recognition=new SpeechRecognition();
 recognition.lang=language.value;
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  status.innerText="● LISTENING";
  document.body.classList.add("active");
 };

 recognition.onresult=(event)=>{
  message.value=event.results[0][0].transcript;
  ask();
 };

 recognition.onerror=()=>{
  document.body.classList.remove("active");
  status.innerText="● VOICE ERROR";
 };

 recognition.onend=()=>{
  if(!isSpeaking){
   document.body.classList.remove("active");
   status.innerText="● JARVIS ONLINE";
  }
 };

 recognition.start();
}

// Stop voice
function stopVoice(){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
 }
 if(recognition){
  try{recognition.abort()}catch(e){}
 }
 isSpeaking=false;
 document.body.classList.remove("active");
 status.innerText="● JARVIS ONLINE";
}

// Enter to send
message.addEventListener("keydown",event=>{
 if(event.key==="Enter")ask();
});

</script>
</body>
</html>
