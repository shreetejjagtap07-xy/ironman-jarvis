
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020817">
<title>JARVIS AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at 50% 35%,#07345a 0%,#031326 42%,#01040b 100%);
 color:#8eeeff;
 font-family:Arial,sans-serif;
 text-align:center;
 overflow-x:hidden;
}
header{
 padding:22px 10px 4px;
 font-size:27px;
 letter-spacing:8px;
 color:#d7faff;
 text-shadow:0 0 18px #00cfff;
}
.sub{
 font-size:10px;
 letter-spacing:4px;
 color:#38bfff;
}
.topline{
 margin:18px auto 0;
 width:90%;
 max-width:430px;
 display:flex;
 justify-content:space-between;
 font-size:10px;
 letter-spacing:2px;
 color:#52cfff;
}
.dot{
 display:inline-block;
 width:7px;height:7px;
 background:#00ffb3;
 border-radius:50%;
 box-shadow:0 0 10px #00ffb3;
 margin-right:6px;
}
.hud{
 width:290px;height:290px;
 margin:24px auto 10px;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
}
.ring{
 position:absolute;
 border-radius:50%;
}
.r1{
 width:280px;height:280px;
 border:2px solid transparent;
 border-top-color:#00dfff;
 border-bottom-color:#00dfff;
 box-shadow:0 0 18px #007bff;
 animation:spin 8s linear infinite;
}
.r2{
 width:245px;height:245px;
 border:2px dashed #159fff;
 animation:reverse 13s linear infinite;
}
.r3{
 width:205px;height:205px;
 border:3px solid transparent;
 border-left-color:#00eaff;
 border-right-color:#00eaff;
 box-shadow:0 0 20px #008cff;
 animation:spin 4s linear infinite;
}
.r4{
 width:165px;height:165px;
 border:1px solid #58dfff;
 box-shadow:inset 0 0 22px #007bff;
}
.core{
 width:112px;height:112px;
 border-radius:50%;
 background:radial-gradient(circle,#fff 0%,#8ffaff 12%,#00aaff 40%,#0045a8 72%,#00132d 100%);
 box-shadow:0 0 25px #00dfff,0 0 65px #007bff;
 animation:pulse 2s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes reverse{to{transform:rotate(-360deg)}}
@keyframes pulse{
 50%{transform:scale(1.1);box-shadow:0 0 85px #00dfff}
}
body.active .core{animation:pulse .55s infinite}
body.active .r1{animation-duration:2s}
.status{
 font-size:12px;
 letter-spacing:3px;
 color:#83eaff;
 margin:12px auto 20px;
}
.panel{
 width:91%;
 max-width:460px;
 margin:auto;
 padding:15px;
 border:1px solid #087cb5;
 border-radius:16px;
 background:rgba(2,18,37,.82);
 box-shadow:0 0 25px #003c69;
}
#reply{
 min-height:70px;
 max-height:180px;
 overflow-y:auto;
 padding:13px;
 color:#e2faff;
 font-size:14px;
 line-height:1.6;
 white-space:pre-wrap;
 text-align:left;
}
input{
 width:100%;
 padding:15px;
 border:1px solid #00bfff;
 border-radius:10px;
 background:#031326;
 color:white;
 outline:none;
 font-size:15px;
}
.controls{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px;
}
button{
 padding:12px 17px;
 border:1px solid #00bfff;
 border-radius:30px;
 background:linear-gradient(135deg,#06365c,#00172d);
 color:#8eeeff;
 font-size:13px;
 box-shadow:0 0 12px #004b83;
}
button:active{background:#00699c}
.small{
 margin-top:18px;
 color:#3986ad;
 font-size:9px;
 letter-spacing:3px;
}
</style>
</head>

<body>

<header>J.A.R.V.I.S</header>
<div class="sub">PERSONAL AI INTERFACE</div>

<div class="topline">
 <span><i class="dot"></i>CORE READY</span>
 <span id="clock">--:--</span>
</div>

<div class="hud">
 <div class="ring r1"></div>
 <div class="ring r2"></div>
 <div class="ring r3"></div>
 <div class="ring r4"></div>
 <div class="core"></div>
</div>

<div class="status" id="status">● JARVIS SYSTEM ONLINE</div>

<div class="panel">
 <div id="reply">Hello! I am JARVIS. How may I assist you?</div>

 <input id="message" placeholder="Ask JARVIS anything...">

 <div class="controls">
  <button onclick="ask()">SEND</button>
  <button onclick="listen()">🎙 SPEAK</button>
  <button onclick="stopVoice()">STOP VOICE</button>
 </div>
</div>

<div class="small">PERSONAL AI • HUD SYSTEM</div>

<script>
const status=document.getElementById("status");

function updateClock(){
 document.getElementById("clock").innerText=
 new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

function speak(text){
 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(text);
 speech.lang="mr-IN";
 speech.rate=0.95;
 speech.pitch=0.9;

 speech.onstart=()=>{
  document.body.classList.add("active");
  status.innerText="● JARVIS SPEAKING";
 };

 speech.onend=()=>{
  document.body.classList.remove("active");
  status.innerText="● JARVIS ONLINE";
 };

 speechSynthesis.speak(speech);
}

async function ask(){
 const input=document.getElementById("message");
 const message=input.value.trim();
 if(!message)return;

 status.innerText="● PROCESSING REQUEST";
 document.body.classList.add("active");

 try{
  const res=await fetch("/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({message})
  });

  if(!res.ok)throw new Error("Connection failed");

  const data=await res.json();
  document.getElementById("reply").innerText=data.reply;

  document.body.classList.remove("active");
  status.innerText="● JARVIS ONLINE";
  speak(data.reply);

 }catch(error){
  document.body.classList.remove("active");
  status.innerText="● CONNECTION ERROR";
  document.getElementById("reply").innerText=
   "I cannot connect right now. Please try again.";
 }
}

function listen(){
 const SpeechRecognition=
  window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  alert("Voice recognition is not supported in this browser.");
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="mr-IN";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  status.innerText="● LISTENING";
  document.body.classList.add("active");
 };

 recognition.onresult=(event)=>{
  document.getElementById("message").value=
   event.results[0][0].transcript;
  ask();
 };

 recognition.onerror=()=>{
  status.innerText="● VOICE ERROR";
  document.body.classList.remove("active");
 };

 recognition.onend=()=>{
  document.body.classList.remove("active");
 };

 recognition.start();
}

function stopVoice(){
 if("speechSynthesis" in window)speechSynthesis.cancel();
 document.body.classList.remove("active");
 status.innerText="● JARVIS ONLINE";
}

document.getElementById("message")
.addEventListener("keydown",function(event){
 if(event.key==="Enter")ask();
});
</script>

</body>
</html>
